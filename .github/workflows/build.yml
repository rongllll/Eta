name: Build APK

# 只做一件事：把源码编成可安装的 APK，产物走 Artifact 下载。
# 与官方 android-release.yml 的区别：不建 Release 草稿、不校验 tag、不跑 lint/单测，
# 面向"自己改一版装上试试"的场景，失败信息尽量直白。

on:
  push:
    branches: [ main, liveupdate ]
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'versionName 后缀，用于区分自编译版本，例如 liveupdate1'
        required: false
        default: 'dev'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 项目用 Java 25 toolchain，必须用 25，低版本会直接编不过。
      - name: 配置 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 项目 compileSdk = 37（Android 16），stable 通道里没有，必须走 canary。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: 安装 SDK 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || \
            sdkmanager --channel=3 "platforms;android-37.0"

      # Gradle 9.7.1 由 wrapper 自己下载，缓存依赖加速后续构建。
      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 写入 local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Peta.buildMetadata="${{ github.event.inputs.version_suffix || 'dev' }}" \
            :app:assembleDebug

      - name: 收集产物
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::没有生成 APK"
            exit 1
          fi
          for f in "${apks[@]}"; do
            echo "产物: $f ($(stat -c%s "$f") 字节)"
          done
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${apks[0]}")" >> "$GITHUB_OUTPUT"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: eta-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # 编译失败时把关键日志贴到步骤摘要，省得翻几万行 output。
      - name: 失败摘要
        if: failure()
        run: |
          echo "## 构建失败" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "检查上面的 Gradle 输出。常见原因：" >> "$GITHUB_STEP_SUMMARY"
          echo "1. SDK 37 未安装成功 -> 看 安装 SDK 37 步骤" >> "$GITHUB_STEP_SUMMARY"
          echo "2. JDK 版本不对 -> 必须是 25" >> "$GITHUB_STEP_SUMMARY"
          echo "3. 代码编译错误 -> 看 Kotlin 报错行号" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
